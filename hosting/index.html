<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0F0F16" />
  <title>CineTrack</title>
  <style>
    :root{color-scheme:dark;--bg:#0f0f16;--card:#171720;--text:#f7f5ff;--muted:#9996a8;--accent:#8b6cff;--border:#2a2938}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,620px)}.card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:30px;text-align:center}
    h1{font-size:48px;margin:0 0 8px}.accent{color:var(--accent)}p{color:var(--muted);line-height:1.6}a{color:#ac98ff}
  </style>
</head>
<body>
<main><div class="card"><h1>Cine<span class="accent">Track</span></h1><p id="message">Abre este enlace desde CineTrack para ver el contenido compartido.</p><p>Descubre, organiza y registra películas y series.</p><p><a href="/privacy">Privacidad</a> · <a href="/delete-account">Eliminar cuenta</a></p></div></main>
<script>
  const path = location.pathname;
  const type = path.startsWith('/profile/') ? 'perfil' : path.startsWith('/review/') ? 'reseña' : path.startsWith('/media/') ? 'título' : 'contenido';
  document.getElementById('message').textContent = `Este enlace comparte un ${type} de CineTrack. Si tienes la app instalada, Android puede abrirlo directamente.`;
</script>
</body>
</html>
